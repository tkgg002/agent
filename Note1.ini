Sơ đồ Phân bổ Thư mục Đích (Hệ Quy Chiếu)
base/ (Infra/Utils): Tầng đáy vô tri. TUYỆT ĐỐI KHÔNG được biết các khái niệm Master, Shadow, Registry, Schema, hay Provisioning. Chỉ chứa các HTTP helpers, DB connection utilities thuần túy, và SQL sanitization helpers.
source/ (Source Connectors & Discovery): Điểm chạm với Upstream. Chịu trách nhiệm Đăng ký nguồn, cấu hình Registry, Khám phá (Discover/Infer) cấu trúc DB gốc, và thực hiện truy vấn DB nguồn.
master/ (Master Swaps & Sync Target): Thao tác DDL cấu trúc cuối cùng và đổ dữ liệu vật lý (Data Plane/Transmute) vào đích.
shadow/ (Shadow Ingestion & Buffer): Quản lý bảng đệm Ingestion và Kafka. Không có quyền vươn tay chọc vào DB gốc.
recon/ (Data Reconcile, DLQ & Self-Healing): Đối soát, xử lý lỗi (DLQ), và Backfill (Hệ thống tự phục hồi).
orchestration/ (State Machine & Scheduler Jobs): Control Plane (Nhạc trưởng). Quản lý State Machine (Tiến trình), Log hoạt động. Không chứa các lệnh DML "bốc vác" dữ liệu.