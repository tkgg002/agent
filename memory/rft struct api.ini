  ---                                                     
  6. Test strategy
                                                          
  - make test → go test ./test/... -short (unit only).
  - make test-integration → -tags=integration (cần        
  DB/NATS/Redis/Kafka up).                                
  - make test-cover → coverage thông qua test/ exercise   
  toàn bộ ./....                                          
  - Test tree mirror cấu trúc production code           
  (test/internal/api, test/internal/app/commands,         
  test/internal/infra/...) — pattern hiếm gặp nhưng giúp
  tách hẳn binary build khỏi test files.                  
                  
  ---                                                   
  7. Gợi ý đọc code theo thứ tự
                                                          
  1. README.md → context tổng.
  2. cmd/server/main.go → bootstrap entrypoint.           
  3. internal/server/server.go → xem toàn bộ DI wiring &  
  registered command subjects.                            
  4. internal/app/ports/command_bus.go + repository.go →  
  contract layer.                                         
  5. internal/infra/messaging/nats_command_bus.go → cách
  Sync/Async được phân biệt & cdc_jobs lifecycle.         
  6. internal/router/router.go → bản đồ endpoint.
  7. Một handler tiêu biểu:                               
  internal/api/master_registry_handler*.go để thấy        
  split-file pattern.                                   
  8.                                                      
  internal/infra/observability/system_health_collector.go 
  + probes/* để hiểu health stack.                      
                                                          
  ---             
  Skills/Tools đã sử dụng:                              
  - Bash (ls, find, wc, cat Makefile) — khám phá file
  system                                             
  - Read — đọc README, main.go, server.go, router.go,     
  config.go, ports/*.go, doc.go các package, embed.go,
  domain/source/object.go                                 
  - ToolSearch — load schema TaskCreate/TaskUpdate (tham
  khảo)                                                   
  - Phân tích pattern: Hexagonal Architecture, CQRS,      
  DDD-lite, Ports & Adapters, Composition Root, Embedded
  Migrations, Split-File Handler, RFC 8594 Deprecation,   
  OTel zap-bridge 



