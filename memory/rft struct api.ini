  Pattern chủ đạo 
                                                        
  - Hexagonal — domain ở giữa; api / persistence /        
  messaging là adapter; ports nằm ở internal/app/ports.
  - CQRS — tách commands/ (write-side) và queries/        
  (read-side); read-side dùng read-repo riêng, không qua  
  domain aggregate.                                     
  - CommandBus 2-mode — SyncCommand chạy in-process,      
  AsyncCommand publish NATS + persist cdc_jobs row        
  (close-loop qua cdc.evt.*.completed từ worker).       
  - Aggregate per package — domain/source, domain/mapping,
   domain/master, domain/job, domain/reconciliation.      
  - Repo-per-aggregate — mỗi aggregate đúng 1 repo;     
  cross-join → tách thành Query handler riêng.            
  - Embed migrations — SQL embed vào binary qua embed.FS,
  runner tự apply lúc boot.                               
                  
  ---                                                     
