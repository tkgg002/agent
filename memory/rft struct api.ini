  ---             
  1. 🔍 Source Discovery & Registration                 
                                       
  Mục tiêu: Khám phá database/collection từ source và đăng
   ký vào registry để CDC theo dõi.                       
  
  - Discover sources: GET /api/v1/sources, GET            
  /api/v1/registry/connections — list connection vật lý
  (Postgres/Mongo).                                       
  - Tạo connection mới: POST /api/v1/sources (hỗ trợ
  MongoDB & PostgreSQL).                                  
  - Introspect MongoDB: liệt kê databases / collections từ
   NATS subject cdc.cmd.introspect.mongo.databases,       
  cdc.cmd.introspect.mongo.collections.
  - Register source object đơn: POST                      
  /api/v1/source-objects/register (admin).
  - Register hàng loạt: POST                            
  /api/v1/source-objects/register-batch                   
  (bulk_register_registry).
  - Scan fields: POST                                     
  /api/v1/source-objects/:id/scan-fields → publish        
  cdc.cmd.scan-fields → worker scan schema.             
  - Scan raw data: NATS cdc.cmd.scan-raw-data → sample    
  data, lắng nghe cdc.evt.scan.raw.*.                     
  - Detect timestamp field: POST                        
  .../detect-timestamp-field (auto detect cột để          
  increment).     
                                                          
  2. ♻️  Source Object Provisioning Lifecycle              
                                                        
  Mục tiêu: Vận hành state machine registered →           
  provisioned → active → disabled/failed cho từng source
  object.                                                 
                  
  - List source objects V2: GET /api/v1/source-objects +  
  filter by state.
  - Stats provisioning: GET /api/v1/source-objects/stats  
  (count theo state).
  - Snapshot trạng thái 1 source: GET                   
  /api/v1/cms/sources/:id/provisioning                    
  (ProvisioningOrchestrator).
  - Standardize: POST                                     
  /api/v1/source-objects/:id/standardize → publish        
  cdc.cmd.standardize.                                  
  - Create default columns: POST                          
  .../create-default-columns → tạo column mặc định        
  (created_at, updated_at, op_type, source_ts) ở shadow.
  - Update V2 directly: PATCH /api/v1/source-objects/:id. 
  - State machine (file provisioning_state_machine.go):
  kiểm soát transition hợp lệ.                            
  
  3. 🗺️  Mapping Rule Management (V2 field mapping)        
                  
  Mục tiêu: Quản lý quy tắc map field từ source (MongoDB  
  nested doc) → shadow column (Postgres).
                                                          
  - List mapping rules: GET /api/mapping-rules.           
  - Tạo mapping rule: POST /api/mapping-rules (gjson path
  + transform_fn).                                        
  - Update status: PATCH /api/mapping-rules/:id (pending →
   active → retired).                                     
  - Preview mapping rule: POST 
  /api/v1/mapping-rules/preview — dry-run gjson +         
  transform_fn trên sample document, không publish
  (in-memory).                                            
  - Reload mapping rules cho worker: POST 
  /api/mapping-rules/reload (publish event để worker      
  invalidate cache).
  - Batch update status: BatchUpdateStatus cho nhiều rule 
  cùng lúc.       
                                                        
  4. 🏛️  Master Binding Management                         
  
  Mục tiêu: Quản trị master table (golden table           
  downstream-facing).
                                                          
  - List masters: GET /api/v1/masters.
  - Tạo master: command create_master.go.               
  - Approve master: command approve_master.go → publish   
  cdc.cmd.master-create cho worker tạo DDL.               
  - Reject master: command reject_master.go.              
  - Master swap (atomic): POST /api/v1/masters/:name/swap 
  → publish cdc.cmd.master-swap (worker swap shadow→master
   qua advisory lock).                                  
  - Toggle active: command toggle_master_active.go.       
                  
  5. 📐 Schema Drift Approval Workflow                  

  Mục tiêu: Khi source DB thêm field mới (drift), CMS     
  pending để operator duyệt thay vì auto-add.
                                                          
  - List pending schema changes: GET                      
  /api/schema-changes/pending.                          
  - Schema change history: GET                            
  /api/schema-changes/history.
  - Approve schema change: POST                         
  /api/schema-changes/:id/approve → publish               
  cdc.cmd.alter-column cho worker ALTER TABLE.
  - Reject schema change: POST                            
  /api/schema-changes/:id/reject.                         
  - Schema proposals: GET /api/v1/schema-proposals, GET 
  /:id (đề xuất schema mới từ scan).                      
  - ApprovalService (approval_service.go): phối hợp
  pending_field + schema_change_log + publish NATS.       
                  
  6. 🔄 Transmute (V1 → V2 transform pipeline) Scheduling 
                  
  Mục tiêu: Lập lịch chạy transmute (apply mapping rule   
  trên shadow rows) định kỳ.
                                                          
  - List schedules: GET /api/v1/schedules.                
  - Update schedule: PATCH /api/v1/schedules/:id.       
  - Create/Toggle schedule: command create_schedule,      
  toggle_schedule.                                        
  - Run transmute thủ công: transmute_run.go → publish  
  cdc.cmd.transmute.                                      
  - Listen completed: subscribe
  cdc.evt.transmute.completed để close-loop job.          
  - Batch transform: NATS cdc.cmd.batch-transform cho hàng
   loạt rows.                                             
                  
  7. 📸 Snapshot & Backfill Orchestration                 
                  
  Mục tiêu: Snapshot initial load + backfill khi thêm     
  field mới.
                                                          
  - Snapshot V2 (Path B): POST                            
  /api/v1/source-objects/:id/snapshot-v2 → publish      
  cdc.cmd.snapshot.v2 (custom snapshot không qua          
  Debezium).      
  - List snapshot progress: query handler               
  list_snapshot_progress (theo dõi % rows processed,      
  cluster_time).
  - Snapshot DLQ: bảng cdc_snapshot_dlq (migration 063)   
  chứa rows snapshot fail.                                
  - Backfill (mapping-driven): NATS cdc.cmd.backfill    
  (publish khi mapping rule mới ra đời, backfill cột này  
  từ source raw). 
  - Backfill source_ts: command recon-backfill-source-ts  
  (đặc thù field timestamp).                              
  - Snapshot pause/resume: hỗ trợ qua                   
  snapshot_progress_status_paused (migration 065).        
                  
  8. 🩺 Reconciliation & Self-Healing                     
                  
  Mục tiêu: Phát hiện gap giữa source và master, tự heal  
  hoặc retry.
                                                          
  - Recon check: command recon_check.go → publish         
  cdc.cmd.recon-check (count diff source vs master).    
  - Recon heal: publish cdc.cmd.recon-heal (worker resync 
  missing rows).                                          
  - Reports & history: list_latest_reports,             
  get_table_history, list_gaps.                           
  - Failed sync logs: list_failed_logs (DLQ message từ
  worker khi map fail).                                   
  - Mark failed log retrying: mark_failed_log_retrying.go
  → publish cdc.cmd.retry-failed.                         
  - Recon enrichment: query recon_enrichment.go (join
  failed log + mapping rule + source object để hiển thị   
  context).       
                                                          
  9. 🧙 Wizard (Source → Master Automation Flow)
                                                        
  Mục tiêu: UX hỗ trợ operator đi từ "chọn source" → "tạo 
  master" qua 11 bước, có state persist.
                                                          
  - Create wizard session: POST /api/v1/wizard/sessions.  
  - Get session: GET /api/v1/wizard/sessions/:id.       
  - Patch session (lưu step tiến): PATCH                  
  /api/v1/wizard/sessions/:id.                            
  - Get progress: GET .../progress.                     
  - Execute wizard (commit cả flow): command              
  wizard_execute.go.                                      
  - AppendProgress: JSONB-array-push atomic vào         
  cdc_wizard_sessions.                                    
                  
  10. 🔌 Debezium / Kafka Connect Command Center          
                  
  Mục tiêu: Quản trị connector lifecycle như 1 control    
  panel (thay cho Kafka Connect REST raw).
                                                          
  - List connectors: GET /api/v1/system/connectors.
  - Get connector detail: GET                           
  /api/v1/system/connectors/:name.                        
  - List plugins: GET /api/v1/system/connector-plugins.
  - Update config: PATCH                                  
  /api/v1/system/connectors/:name/config.
  - Delete connector: DELETE                              
  /api/v1/system/connectors/:name.
  - Create connector: command system_connector.go       
  (auto-inject signal topic).                             
  - Lifecycle (start/stop/restart): command
  LifecycleSystemConnectorHandler (kèm rate limit 3       
  lần/giờ cho restart).
  - Debezium signals: NATS cdc.cmd.debezium-signal,       
  cdc.cmd.debezium-snapshot (ad-hoc snapshot 1            
  collection).                                          
  - Restart Debezium: NATS cdc.cmd.restart-debezium.      
                  
  11. 📈 System Health Monitoring                         
  
  Mục tiêu: Aggregate health tất cả deps thành 1 snapshot,
   expose cho dashboard.
                                                          
  - Health snapshot: GET /api/v1/system/health (đọc Redis 
  snapshot do collector ghi).                           
  - Probes (mỗi 10s): Postgres / Redis / NATS / Kafka     
  Connect / Kafka Lag / Debezium / Worker / Deps.         
  - Compute logic (system_health_compute.go): pure func 
  tổng hợp status healthy/degraded/critical.              
  - Prometheus client: query metric trực tiếp
  (get_metric_health.go).                                 
  - Background collector goroutine: healthCollector.Run()
  chạy song song HTTP.                                    
                  
  12. 🚨 Alerting & Acknowledgement                       
                  
  Mục tiêu: Phát alert khi health degrade, cho phép ack / 
  silence.        
                                                        
  - List alerts: handler alerts_handler.go.               
  - Ack alert: command ack_alert.go.
  - Silence alert (mute X giờ): command silence_alert.go. 
  - Auto-resolve: RunBackgroundResolver() — khi root cause
   hết thì auto close alert.                              
  - Alert emission: system_health_alerts.go so sánh       
  snapshot trước/sau → emit/clear.                        
                                                        
  13. ⚙️  Async Job Tracking (CommandBus)                  
                  
  Mục tiêu: Mọi async action có job ID để FE polling —    
  không "fire & forget".
                                                          
  - Persist job: cdc_jobs table (status: pending → running
   → succeeded/failed).                                 
  - Get job: GET /api/jobs/:id.                           
  - CommandBus 2-mode: Execute (sync, return body) /
  Dispatch (async, return JobID).                         
  - JobMonitor close-loop: subscribe cdc.evt.*.completed
  từ worker, update row.                                  
  - Stuck job reaper: background goroutine (30s/lần) —
  mark fail jobs running quá ngưỡng.                    
  - Idempotency: Idempotency-Key header → reuse cùng row,
  tránh duplicate command.

  14. ⏰ Worker Schedule Management

  Mục tiêu: Lập lịch tự động cho các worker periodic (vd  
  recon scheduler).
                                                          
  - List worker schedules: GET /api/worker-schedule.      
  - Create: POST /api/worker-schedule.                  
  - Update: PATCH /api/worker-schedule/:id.               
  - Storage: worker_schedule table (migration 007), driver
   cron/v3.                                               
  
  15. 📋 Audit & QA Reporting                             
                  
  Mục tiêu: Báo cáo chất lượng cho compliance.            
                  
  - QA summary: query get_qa_summary.go — tỷ lệ row đồng  
  bộ thành công.  
  - Gaps list: list_gaps.go — danh sách bảng đang có gap  
  chưa heal.                                              
  - Metric health: get_metric_health.go — query         
  Prometheus.                                             
  - Audit handler: tổng hợp 3 cái trên cho dashboard QA.
                                                          
  16. 📝 Activity Log Tracking                            
                                                          
  Mục tiêu: Audit log mọi action operator thực hiện.      
                                                        
  - List activity logs: GET /api/activity-log (filter by  
  user/action/time).
  - Stats: GET /api/activity-log/stats (count theo loại 
  action).                                                
  - ActivityLogger goroutine: batch insert async (không
  block request).                                         
  - Auto inject: middleware audit.go tự ghi cho mọi
  destructive call.                                       
                  
  17. 🔒 Security / Auth / Rate-Limit                     
                  
  Mục tiêu: Bảo vệ admin endpoint.                        
                  
  - JWT validation: middleware jwt.go — validate token từ 
  cdc-auth-service.
  - RBAC: middleware rbac.go — check role scope.          
  - Idempotency: middleware idempotency.go (Redis-backed, 
  replay-safe).                                         
  - Rate limit: middleware ratelimit.go (sliding window   
  Redis), config riêng cho restart (3/h).                 
  - Deprecation header: middleware deprecation.go (RFC  
  8594 Sunset) cho legacy /api/* không phải /api/v1/*.    
  - CORS: Fiber CORS middleware.
                                                          
  18. 🛠️  Migration & Bootstrap
                                                          
  Mục tiêu: Tự động setup schema + seed khi khởi động.    
                                                        
  - Embedded migrations: migrations/embed.go embed toàn bộ
   SQL vào binary.
  - Migration runner: migrate.Run() — apply theo thứ tự   
  sort file path, idempotent.                             
  - Seed data: enum defaults, V2 default connections,   
  worker schedules.                                       
  - Bootstrap shadow connection:
  EnsureDefaultShadowConnection — seed connection mặc định
   cho ShadowAutomator.
  - Legacy V1 → V2 sync: SyncLegacyToV2Bootstrap — đồng bộ
   registry cũ sang V2 schema lúc boot.                   
  - Migration flags: skipSeeds, skipCluster (cluster level
   = role/search_path, thường skip ở app).                
                  
