  3. Các pattern quan trọng cần lưu ý
                                                          
  3.1. CQRS + CommandBus 2-mode (đặc trưng nhất)
                                                          
  - SyncCommand (SyncCommandMixin{} marker) → bus.Execute:
   persist cdc_jobs(running) → exec handler in-process →  
  update cdc_jobs(succeeded/failed) → trả json.RawMessage 
  body inline cho HTTP response.                        
  - AsyncCommand (AsyncCommandMixin{} marker) →         
  bus.Dispatch: persist cdc_jobs(pending) → publish NATS  
  subject (cdc.cmd.*) → trả JobID; FE poll GET 
  /api/jobs/:id. Worker xử lý xong emit                   
  cdc.evt.*.completed → JobMonitor (worker-side)
  close-loop update row.                                
  - Mixin zero-size + unexported marker method →
  type-safe, không thể gọi nhầm Execute với async command.
  - Idempotency-Key: command optionally implement
  interface{ IdempotencyKey() string } → row được upsert  
  thay vì insert mới.
                                                          
  3.2. Repository per Aggregate + Read-Models tách riêng
                                                        
  - Ports MappingRuleRepo, SourceRepo, MasterRepo,        
  JobRepo... mỗi cái wrap đúng 1 aggregate.
  - Cross-aggregate join không đi qua repo → tách thành   
  Query handler chuyên dụng (vd resolve_mapping_scope.go, 
  recon_enrichment.go).                                 
  - Read-side dùng repo riêng (*_read_repo_gorm.go) —     
  read-models có thể flatten/denormalize, tách khỏi domain
   entity.                                              
                                                          
  3.3. Hexagonal layer enforcement
                                                        
  - Quy tắc cứng: chỉ internal/infra/persistence/ được    
  dùng *gorm.DB + raw SQL + schema-qualified name.
  API/app/domain layer cấm chạm gorm.DB.                  
  - Domain (internal/domain/*) pure Go, không import
  infra; chứa aggregate + lifecycle state.                
  
  3.4. Bootstrap & DI thủ công                            
                  
  - Không dùng Wire/Fx — server.New() là composition root 
  wire bằng tay (~270 dòng), dễ trace dependency.
  - internal/bootstrap/ chứa init-time domain bootstrap   
  (seed connection mặc định, đồng bộ V1→V2) — khác với DI.
                                                        
  3.5. Split-file Handler Pattern                         
                  
  - Handler lớn (master_registry_handler,                 
  registry_handler, reconciliation_handler,
  mapping_rule_handler) chia file theo verb               
  (create/read/approve/swap/...) thay vì 1 file 2000 dòng
  → dễ review & merge conflict thấp.                    

  3.6. Embedded Migrations + per-context folder

  - migrations/embed.go dùng //go:embed → binary tự áp    
  migration lúc boot.
  - SQL tổ chức theo bounded-context (core / registry /   
  worker / recon_dlq / cdc_system_model / ops /           
  audit_security / ids / partitioning) thay vì theo     
  timeline thuần.                                         
                  
  3.7. Background workers song song HTTP                  
  
  4 goroutine chạy nền cùng Fiber:                        
  1. HealthCollector — scrape probe → Redis snapshot
  (10s).                                                  
  2. AuditLogger — batch insert audit events từ
  middleware.                                           
  3. AlertManager.RunBackgroundResolver — auto-resolve    
  alert khi root cause hết.                           
  4. StuckJobReaper — sweep cdc_jobs running quá ngưỡng → 
  mark failed (idempotent crash recovery).               
                                                          
  3.8. Destructive endpoint protection (Phase 4)
                                                          
  router.DestructiveMiddleware bundle = Idempotency       
  (Redis) + Audit (background insert) + RateRestart (3/h  
  cho connector restart). Mount selective theo route.     
                                                        
  3.9. Legacy API deprecation                             
  
  Middleware DeprecateLegacyAPIPath gắn header RFC 8594   
  (Sunset, Deprecation, Link: <successor>; 
  rel=successor-version) cho mọi /api/* không phải      
  /api/v1/* → cho phép migrate FE từng phần.

  3.10. OpenTelemetry tích hợp sâu                        
  
  - main.go wire otelzap bridge: log →                    
  zapcore.NewTee(consoleCore, otelCore) → song hành
  console + SigNoz.                                       
  - Tracer init qua OTLP HTTP, sample-ratio configurable.
                                                          
  3.11. Naming centralization                             
                                                          
  internal/naming/naming.go là single source of truth cho 
  mọi schema/topic/subject string → tránh magic-string rải
   rác (đặc biệt quan trọng vì service publish hàng chục  
  NATS subject cdc.cmd.*).
                                                        
  3.12. Config-driven dual-DB                             
  
  - db (control plane, cdc_dw @ 5433) — chứa metadata     
  cdc_cms.        
  - shadowDb (data plane, có thể khác host) —             
  ShadowAutomator tạo shadow table DDL ở đây. Nếu không   
  cấu hình → fallback control plane (Path A) và cảnh báo 
  log.                                                    
                  
  ---                                                   
