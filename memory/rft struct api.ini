  🎯 3 chức năng quan trọng nhất (theo độ phụ thuộc của 
  FE)                                                     
     
  1. Wizard + Source Object Provisioning — entry point của
   90% workflow operator.                                 
  2. Mapping Rule + Schema Drift Approval — core của V2 
  transform pipeline.                                     
  3. System Health + Job Tracking — operator dùng liên tục
   để biết trạng thái pipeline.                           
                  
  ⚠️  2 chức năng "ẩn" dễ bị bỏ qua khi review             
                  
  1. Async Job Tracking (CommandBus) — hạ tầng âm thầm    
  nhưng mọi POST/PATCH đều đi qua. Hỏng = mất audit, mất
  idempotency.                                            
  2. Bootstrap V1→V2 sync (SyncLegacyToV2Bootstrap) — chạy
   mỗi lần boot, không có test. Đây là điểm rủi ro cao khi
   migrate dữ liệu cũ.
                                                          
