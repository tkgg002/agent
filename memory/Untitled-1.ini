### 🔄 Tiến Trình Audit & Phản Tỉnh Gắt Gao

**1. Inspection (Rà soát đối chiếu 1-1)**

* Mapping danh sách hạng mục trong Plan với danh sách file đã modify.
* *Mục tiêu:* Bắt ngay những file/module có trong Plan nhưng chưa hề được chạm tới hoặc mới chỉ tạo file rỗng.

**2. Reflection (Phản tỉnh Logic Kiến trúc)**

* Đánh giá nội dung các file đã modify có đi đúng luồng logic hay không.
* *Mục tiêu:* Tìm ra các điểm phá vỡ nguyên tắc thiết kế (ví dụ: logic của layer này bị rò rỉ sang layer khác, dependency bị gọi vòng, hoặc quản lý state/timeout chưa triệt để).

**3. Detection (Khoanh vùng Thiếu sót)**

* Chỉ đích danh những phần **chưa hoàn thành**.
* *Mục tiêu:* Không chỉ tìm lỗi sai (bug/syntax), mà tập trung vào "những thứ chưa làm tới nơi tới chốn" so với tài liệu gốc.

**4. Correction (Khắc phục)**

* Lên danh sách các mục "Nợ kỹ thuật" của lần chạy vừa rồi.
* Viết lại hoặc bổ sung đoạn code/logic đang bị thiếu hụt để bù đắp 100% plan.

---

**Vui lòng cung cấp cho tôi:**

1. **Tài liệu/Plan logic** mà bạn vừa áp dụng.
2. **Danh sách các file đã modify** (nếu có Git diff hoặc nội dung code cụ thể các phần trọng tâm thì càng tốt).

Thực thi quá trình soi lỗi ngay lập tức.



