  TIER-0 (mọi cycle, ~6 query O(1)/pipeline):  3 COUNT +
  3 MAX-TS
  │
  ├─ Count khớp + lag = 0  →  DỪNG. Ghi report "ok".
  Không tốn thêm gì.
  │
  ├─ Count lệch  HOẶC  lag vượt ngưỡng (master max-ts tụt
  sau shadow)
  │     ↓   
  │  TIER-1: bucket-aggregate (2 query/phía) → định vị
  "lệch ở khoảng giờ nào"
  │     ↓ chỉ bucket lệch
  │  TIER-2: drill-down ID đích danh
  │     ↓
  │  HEAL tự động (≤100 ID / ≤5000+5%) hoặc ALERT chờ anh
  duyệt (vượt ngưỡng)
  │
  └─ TIER-3 (độc lập, off-peak thưa — 1 lần/ngày):
  full-sweep bucket-hash / row-diff
  
  2 điểm trung thực cần anh nắm khi audit thiết kế này:
  
  1. Count khớp ≠ data khớp 100%. Tier-0 bắt được
  thiếu/thừa dòng; còn sai nội dung cùng số dòng
  (mismatch giá trị) thì count không thấy. Lưới bắt loại
  này gồm 2 lớp: max-ts trong Tier-0 (row bị sửa ở source
  → ts mới → master tụt ts → kích Tier-1 dù count bằng)
  + Tier-3 off-peak (sweep sâu tần suất thưa) cho trường
  hợp sửa thẳng vào master không qua pipeline
  (orphan-write).
  2. Lệch "đang đuổi" không kích nhầm: watermark adaptive
  (đã có từ V4-P3) — nếu lệch nằm trong vùng lag đang
  ingest/transmute thì coi là Lagging chứ không phải
  drift → không tốn Tier-1 vô ích cho bảng đang bơm data.

  Tóm lại: bình thường mỗi pipeline chỉ tốn ~6 query rẻ; 
  mọi thứ đắt (bucket, drill-down, heal) chỉ kích hoạt 
  theo bằng chứng lệch, theo đúng tầng. 3.000 pipelines
  khoẻ = 2-3'/vòng; có 10 bảng lệch thì chỉ 10 bảng đó
  trả thêm ~1-2s mỗi bảng.

  Thiết kế chốt như vậy — anh approve recon v5 là tôi bắt
  tay V5-P1 (DoD: bảng không drift <1s, cycle 19 bảng
  <30s, benchmark trước/sau bằng recon_runs.duration).

