NOTE:

1. MENTALITY & ARCHITECTURE
- "Simplicity First, minimal impact": Viết code với Blast Radius nhỏ nhất. Tối giản số dòng code thay đổi, giữ nguyên vẹn pattern và phong cách viết có sẵn của source code. Không vẽ việc, không over-engineer.
- Core Systems Only: Giải quyết tận gốc ở tầng kiến trúc hệ thống. TUYỆT ĐỐI KHÔNG cheat DB, không thay đổi config/môi trường bừa bãi để đối phó lấy kết quả bề nổi.
2. VERIFICATION & STRICT REPORTING
- Luôn đọc và hiểu sâu toàn bộ bài học (Lessons) trước khi bắt tay vào làm. Tuân thủ chuẩn chỉ role/skills quy định trong `work/agent/GEMINI.md`.
- Trước khi báo DONE: Bắt buộc phải tự chạy build/test để xác nhận tất cả dịch vụ (Services/Workers) chạy ổn định, không thối code, không lỗi cú pháp.
- Kết thúc task: Bắt buộc phải tạo file `report_*.md` (Đặt tên theo task). Ghi rõ lý do thay đổi và danh sách "Những file thực tế đã sửa", "Số lượng dòng code thay đổi" dựa trên kết quả kiểm tra thực tế (git diff). TUYỆT ĐỐI KHÔNG báo cáo láo, không chế số liệu.
3. SOLUTION DELIVERABLE
- Đề xuất giải pháp DUY NHẤT và TỐT NHẤT dựa trên tính toán kỹ thuật thực tế. 
- NGHIÊM CẤM cái giọng điệu văn mẫu chia Option 1, Option 2, Option 3 gây nhiễu. Đi thẳng vào thiết kế chi tiết kèm code demo cụ thể đến từng ngóc ngách.
4. PIPELINE SCOPE RESTRICTION
- Khi đang xử lý luồng [Shadow -> Master], NGHIÊM CẤM đụng chạm, chỉnh sửa hoặc làm ảnh hưởng đến luồng [Source -> Shadow]. Giữ cô lập hoàn toàn hai tầng này.



